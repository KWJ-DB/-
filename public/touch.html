<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFE3EB">
<title>우리 · 맞대기</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/app.css">
<style>
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #FFF3F7, #FFD9E4 70%, #F6B8CC); }
  .wait { text-align: center; padding: 30px; }
  .wait img { width: 84px; height: 84px; border-radius: 26px; box-shadow: 0 12px 30px rgba(182,95,224,.3); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) scale(1.04); } }
  .wait h1 { font-size: 22px; font-weight: 850; color: #B8325F; margin: 22px 0 6px; }
  .wait p { color: #A0607A; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
  .wait a { display: inline-block; padding: 12px 22px; border-radius: 14px; background: #fff; color: #E0507C; font-weight: 750; text-decoration: none; box-shadow: 0 6px 16px rgba(200,80,130,.15); }
  #fx .fx-home { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: calc(env(safe-area-inset-bottom) + 40px); padding: 12px 22px; border-radius: 14px; background: rgba(255,255,255,.85); color: #E0507C; font-weight: 750; text-decoration: none; opacity: 0; animation: ftxt .5s 2.4s forwards; }
</style>
</head>
<body>
<div class="wait" id="wait">
  <img src="/logo.svg" alt="">
  <h1 id="wt">맞대는 중...</h1>
  <p id="wp">잠깐만 그대로 있어 주세요</p>
  <a href="/" id="wa" hidden>앱 열기</a>
</div>
<div id="fx" hidden></div>
<script>
(() => {
  const k = location.hash.slice(1);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const HEART = (id, c1, c2) => `<svg viewBox="0 0 24 24"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><path fill="url(#${id})" d="M12 21s-7.8-4.8-9.6-9.7C1.1 7.6 3.4 4 7 4c2.1 0 3.7 1.1 5 3 1.3-1.9 2.9-3 5-3 3.6 0 5.9 3.6 4.6 7.3C19.8 16.2 12 21 12 21z"/></svg>`;
  const WHITE = `<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.8-4.8-9.6-9.7C1.1 7.6 3.4 4 7 4c2.1 0 3.7 1.1 5 3 1.3-1.9 2.9-3 5-3 3.6 0 5.9 3.6 4.6 7.3C19.8 16.2 12 21 12 21z"/></svg>`;
  let off = 0, done = false;
  const started = Date.now();

  function dday(start) {
    const [y, m, d] = start.split("-").map(Number);
    const n = new Date();
    return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(y, m - 1, d)) / 864e5) + 1;
  }
  function play(info) {
    if (done) return; done = true;
    const R = (a, b) => a + Math.random() * (b - a);
    const floaters = Array.from({ length: 14 }, () => `<span style="left:${R(6, 90)}%;--sz:${R(12, 26).toFixed(0)}px;--dur:${R(3, 4.4).toFixed(2)}s;--dl:${R(0.9, 2.2).toFixed(2)}s;--sw:${R(-30, 30).toFixed(0)}px">${WHITE}</span>`).join("");
    const fx = $("fx");
    fx.innerHTML = `
      <div class="fx-h l">${HEART("fa", "#FFB3C6", "#F2668B")}</div>
      <div class="fx-h r">${HEART("fb", "#D9C8FF", "#9B7CF6")}</div>
      <div class="fx-ripple"></div>
      <div class="fx-big">${HEART("fc", "#FF9BB4", "#C86BE6")}</div>
      <div class="fx-float">${floaters}</div>
      <div class="fx-text"><b>우리 지금 닿았어요</b><span>${esc(info.names.a)} · ${esc(info.names.b)} · ${dday(info.start)}일째</span></div>
      <a class="fx-home" href="/">앱 열기</a>`;
    $("wait").hidden = true;
    fx.hidden = false;
    try { navigator.vibrate && navigator.vibrate([30, 80, 30]); } catch {}
  }
  function schedule(info) {
    const wait = (info.at || info.touch) - off - Date.now();
    setTimeout(() => play(info), Math.max(0, Math.min(wait, 3000)));
  }
  function fail(t, p) { $("wt").textContent = t; $("wp").textContent = p; $("wa").hidden = false; }

  async function go() {
    if (!k) return fail("링크가 올바르지 않아요", "설정에서 맞대기 링크를 다시 복사해 주세요");
    try {
      const t0 = Date.now();
      const r = await fetch("/api/nfc", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ k }) });
      const d = await r.json();
      const t1 = Date.now();
      if (!r.ok) return fail("링크가 올바르지 않아요", d.error || "설정에서 맞대기 링크를 다시 복사해 주세요");
      off = d.now - (t0 + t1) / 2;
      if (d.match) return schedule(d);
      // 상대 폰이 조금 늦게 읽을 수 있어서 6초 동안 확인
      const iv = setInterval(async () => {
        if (done) return clearInterval(iv);
        if (Date.now() - started > 6500) {
          clearInterval(iv);
          return fail("상대 폰도 같이 맞대야 해요", "두 폰 뒷면 위쪽을 동시에 맞대 보세요");
        }
        try {
          const g = await (await fetch("/api/nfc?k=" + encodeURIComponent(k))).json();
          if (g.kind === "nfc" && g.touch > started - 6000 - off) { clearInterval(iv); schedule(g); }
        } catch {}
      }, 300);
    } catch (e) { fail("연결 오류", "인터넷 연결을 확인해 주세요"); }
  }
  go();
})();
</script>
</body>
</html>
