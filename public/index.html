<!-- 처음 설정 -->
<section id="setup" class="gate" hidden>
  <div class="gate-card">
    <img class="gate-logo" src="/logo.svg" alt="">
    <h1>우리 둘만의 공간</h1>
    <p class="muted">처음 한 번만 설정하면 돼요</p>
    <label>내 이름<input id="suA" type="text" maxlength="20" placeholder="예: 우진"></label>
    <label>여자친구 이름<input id="suB" type="text" maxlength="20" placeholder="예: 지민"></label>
    <label>사귄 날<input id="suStart" type="date"></label>
    <label>둘이 같이 쓸 비밀번호<input id="suPw" type="password" maxlength="64" placeholder="4자 이상"></label>
    <label>비밀번호 확인<input id="suPw2" type="password" maxlength="64"></label>
    <div class="form-err" id="suErr"></div>
    <button class="btn primary block" id="suGo">시작하기</button>
  </div>
</section>

<!-- 로그인 -->
<section id="login" class="gate" hidden>
  <div class="gate-card">
    <img class="gate-logo" src="/logo.svg" alt="">
    <h1 id="loginTitle">우주</h1>
    <p class="muted">누구인지 고르고 비밀번호를 입력하세요</p>
    <div class="who-pick" id="whoPick"></div>
    <label>비밀번호<input id="liPw" type="password" maxlength="64"></label>
    <div class="form-err" id="liErr"></div>
    <button class="btn primary block" id="liGo">들어가기</button>
  </div>
</section>

<!-- 메인 -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="/logo.svg" alt=""><span class="nm brand-t">우주</span><span class="brand-sub"><span id="brandA"></span><svg class="i heart"><use href="#i-heart"/></svg><span id="brandB"></span></span></div>
    <button class="icon-btn" id="btnSettings" aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>
  <main id="view"></main>
  <div id="mapWrap" hidden>
    <div id="map"></div>
    <div class="map-card" id="mapCard"></div>
    <div class="map-fabs">
      <button class="icon-btn" id="eatBtn" data-act="eatToggle" aria-label="맛집 지도"><svg class="i"><use href="#i-bowl"/></svg></button>
      <button class="icon-btn" id="satBtn" data-act="satToggle" aria-label="위성 지도"><svg class="i"><use href="#i-layers"/></svg></button>
      <button class="icon-btn" data-act="placesSheet" aria-label="장소 알림"><svg class="i"><use href="#i-pin"/></svg></button>
      <button class="icon-btn" data-act="fitMap" aria-label="모두 보기"><svg class="i"><use href="#i-target"/></svg></button>
    </div>
  </div>
  <div id="chatWrap" hidden>
    <div class="dm-head">
      <span id="dmAv"></span>
      <div class="dm-who"><b id="dmName"></b><span id="dmSub"></span></div>
      <button class="icon-btn" data-act="dmSearch" aria-label="메시지 검색"><svg class="i"><use href="#i-search"/></svg></button>
    </div>
    <button class="dm-pin" id="dmPin" data-act="pinGo" hidden></button>
    <div class="dm-list" id="dmList"></div>
    <button class="dm-jump" id="dmJump" data-act="dmJump" hidden><svg class="i"><use href="#i-down"/></svg><span>새 메시지</span></button>
    <div class="dm-input">
      <div class="dm-reply" id="dmReply" hidden></div>
      <div class="dm-plusmenu" id="dmPlusMenu" hidden>
        <button data-act="dmPhoto"><span><svg class="i"><use href="#i-image"/></svg></span>사진</button>
        <button data-act="dmLoc"><span><svg class="i"><use href="#i-pin"/></svg></span>내 위치</button>
        <button data-act="dmEvent"><span><svg class="i"><use href="#i-cal"/></svg></span>일정</button>
        <button data-act="dmHeart"><span><svg class="i"><use href="#i-heart"/></svg></span>하트</button>
      </div>
      <div class="dm-pill">
        <button class="dm-plus" data-act="dmPlus" aria-label="더보기"><svg class="i"><use href="#i-plus"/></svg></button>
        <input type="file" id="dmFile" accept="image/*" multiple hidden>
        <textarea id="dmText" rows="1" placeholder="메시지 보내기" maxlength="2000" enterkeyhint="send"></textarea>
        <button class="dm-send" id="dmSend" data-act="dmSend" aria-label="보내기"><svg class="i"><use href="#i-heart"/></svg></button>
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <span class="tab-pill" aria-hidden="true"></span>
    <button data-tab="home" class="on"><svg class="i"><use href="#i-home"/></svg><span>홈</span></button>
    <button data-tab="chat"><svg class="i"><use href="#i-msg"/></svg><span>채팅</span><i class="badge" id="cBadge" hidden></i></button>
    <button data-tab="question"><svg class="i"><use href="#i-chat"/></svg><span>질문</span><i class="badge" id="qBadge" hidden></i></button>
    <button data-tab="calendar"><svg class="i"><use href="#i-image"/></svg><span>추억</span></button>
    <button data-tab="map"><svg class="i"><use href="#i-pin"/></svg><span>위치</span></button>
