<!-- 처음 설정 -->
<section id="setup" class="gate" hidden>
  <div class="gate-card">
    <img class="gate-logo" src="/logo.svg" alt="">
    <h1>우리 둘만의 공간</h1>
    <p class="muted">처음 한 번만 설정하면 돼요</p>
    <label>내 이름<input id="suA" type="text" maxlength="20" placeholder="예: 우진"></label>
    <label>여자친구 이름<input id="suB" type="text" maxlength="20" placeholder="예: 지민"></label>
    <label>사귄 날<input id="suStart" type="date"></label>
    <label>둘이 같이 쓸 비밀번호<input id="suPw" type="password" maxlength="64" placeholder="4자 이상"></label>
    <label>비밀번호 확인<input id="suPw2" type="password" maxlength="64"></label>
    <div class="form-err" id="suErr"></div>
    <button class="btn primary block" id="suGo">시작하기</button>
  </div>
</section>

<!-- 로그인 -->
<section id="login" class="gate" hidden>
  <div class="gate-card">
    <img class="gate-logo" src="/logo.svg" alt="">
    <h1 id="loginTitle">우리</h1>
    <p class="muted">누구인지 고르고 비밀번호를 입력하세요</p>
    <div class="who-pick" id="whoPick"></div>
    <label>비밀번호<input id="liPw" type="password" maxlength="64"></label>
    <div class="form-err" id="liErr"></div>
    <button class="btn primary block" id="liGo">들어가기</button>
  </div>
</section>

<!-- 메인 -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="/logo.svg" alt=""><span class="nm" id="brandA"></span><svg class="i heart"><use href="#i-heart"/></svg><span class="nm" id="brandB"></span></div>
    <button class="icon-btn" id="btnSettings" aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>
  <main id="view"></main>
  <div id="mapWrap" hidden>
    <div id="map"></div>
    <div class="map-card" id="mapCard"></div>
  </div>
  <div id="chatWrap" hidden>
    <div class="dm-head">
      <span id="dmAv"></span>
      <div class="dm-who"><b id="dmName"></b><span id="dmSub"></span></div>
    </div>
    <div class="dm-list" id="dmList"></div>
    <div class="dm-input">
      <div class="dm-pill">
        <button class="dm-cam" data-act="dmPhoto" aria-label="사진 보내기"><svg class="i"><use href="#i-camera"/></svg></button>
        <input type="file" id="dmFile" accept="image/*" multiple hidden>
        <input id="dmText" type="text" placeholder="메시지 보내기..." maxlength="2000" autocomplete="off" enterkeyhint="send">
        <button id="dmSend" data-act="dmSend" hidden>보내기</button>
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <span class="tab-pill" aria-hidden="true"></span>
    <button data-tab="home" class="on"><svg class="i"><use href="#i-home"/></svg><span>홈</span></button>
    <button data-tab="chat"><svg class="i"><use href="#i-msg"/></svg><span>채팅</span><i class="badge" id="cBadge" hidden></i></button>
    <button data-tab="question"><svg class="i"><use href="#i-chat"/></svg><span>질문</span><i class="badge" id="qBadge" hidden></i></button>
    <button data-tab="calendar"><svg class="i"><use href="#i-image"/></svg><span>추억</span></button>
    <button data-tab="map"><svg class="i"><use href="#i-pin"/></svg><span>위치</span></button>
  </nav>
</div>

<!-- 모달 / 라이트박스 -->
<div class="sheet-bg" id="sheet" hidden><div class="sheet-box" id="sheetBox"></div></div>
<div class="lightbox" id="lightbox" hidden></div>
<div id="fx" hidden></div>
<div id="rx" hidden></div>
<button id="banner" hidden></button>
<div id="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/questions.js"></script>
<script src="/app.js"></script>
</body>
