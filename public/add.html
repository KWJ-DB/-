<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우주 · 장소 등록</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --ink: #2B2330; --sub: #8A7F88; --line: #EEE6EB; --bg: #FBF7F9; --rose: #F2668B; --rose-d: #E04E77; --soft: #FFF0F5; --blue: #3B7BF6; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; letter-spacing: -0.01em; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .app { display: grid; grid-template-columns: 440px 1fr; height: 100vh; }
  .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: #fff; }
  .top { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand img { width: 30px; height: 30px; border-radius: 9px; }
  .brand b { font-size: 19px; }
  .brand span { color: var(--sub); font-size: 14px; }
  .brand a { margin-left: auto; color: var(--sub); font-size: 13px; text-decoration: none; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: #F3EEF1; gap: 4px; }
  .seg button { height: 38px; border-radius: 11px; font-weight: 700; font-size: 14.5px; color: var(--sub); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(120,60,90,.1); }
  .search { display: flex; gap: 8px; margin-top: 12px; }
  .search input { flex: 1; height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; font-size: 15.5px; outline: none; }
  .search input:focus { border-color: var(--rose); }
  .btn { white-space: nowrap; flex: none; height: 46px; padding: 0 16px; border-radius: 14px; background: var(--rose); color: #fff; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--rose-d); }
  .btn.gray { background: #F3EEF1; color: var(--ink); }
  .btn.sm { height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13.5px; }
  .hint { margin-top: 8px; font-size: 12.5px; color: var(--sub); }
  .tabs { display: flex; gap: 16px; padding: 0 22px; border-bottom: 1px solid var(--line); }
  .tabs button { padding: 12px 0; font-weight: 700; font-size: 14px; color: var(--sub); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-color: var(--ink); }
  .list { flex: 1; overflow-y: auto; padding: 8px 12px 20px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.6; }
  .row { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 11px 10px; border-radius: 14px; }
  .row:hover, .row.hl { background: #FAF5F8; }
  .row .n { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .row .t { min-width: 0; cursor: pointer; }
  .row .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { display: block; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row .t em { font-style: normal; color: var(--rose); font-weight: 600; }
  .acts { display: flex; gap: 6px; }
  .acts .done { font-size: 12.5px; color: #2FA36B; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .chip { display: inline-block; padding: 2px 7px; border-radius: 7px; background: #F3EEF1; font-size: 11.5px; font-weight: 700; color: var(--sub); margin-left: 6px; vertical-align: 1px; }
  textarea { width: 100%; min-height: 150px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; resize: vertical; font-size: 14.5px; line-height: 1.6; outline: none; }
  textarea:focus { border-color: var(--rose); }
  .bulk { padding: 14px 10px; }
  .bulk .bar { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .bulk .bar span { margin-left: auto; font-size: 13px; color: var(--sub); }
  .ck { width: 20px; height: 20px; accent-color: var(--rose); }
  .mapwrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 11px 18px; border-radius: 14px; background: rgba(43,35,48,.92); color: #fff; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.on { opacity: 1; }
  .mk { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; }
  .mk.hl { background: var(--rose); transform: scale(1.2); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #B9AEB6; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .dot.mine { background: var(--rose); }
  .gate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 20; }
  .gate .card { width: 340px; padding: 28px; border-radius: 22px; background: #fff; box-shadow: 0 12px 40px rgba(120,60,90,.12); }
  .gate h2 { margin: 0 0 6px; }
  .gate p { margin: 0 0 16px; color: var(--sub); font-size: 14px; }
  .gate .who { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .gate .who button { height: 44px; border-radius: 12px; background: #F3EEF1; font-weight: 700; }
  .gate .who button.on { background: var(--ink); color: #fff; }
  .gate input { width: 100%; height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 10px; font-size: 15px; outline: none; }
  .gate .err { color: var(--rose-d); font-size: 13px; min-height: 18px; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; grid-template-rows: 1fr 38vh; } .side { border-right: 0; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-fork" viewBox="0 0 24 24"><path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2.5-3 6s1 4 3 4v8"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-9.2C1.6 7.4 4 4 7.4 4 9.6 4 11 5.3 12 6.8 13 5.3 14.4 4 16.6 4 20 4 22.4 7.4 21 10.8 19 15.6 12 20 12 20z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
</svg>

<div class="gate" id="gate" hidden>
  <div class="card">
    <h2>우주 로그인</h2>
    <p>컴퓨터에서 장소를 등록하려면 한 번 로그인해요.</p>
    <div class="who" id="who"></div>
    <input type="password" id="pw" placeholder="커플 비밀번호">
    <div class="err" id="err"></div>
    <button class="btn" style="width:100%;justify-content:center" id="go">로그인</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <div class="side">
    <div class="top">
      <div class="brand"><img src="/icon-192.png" alt=""><b>우주</b><span>장소 등록</span><a href="/#map">우주 열기</a></div>
      <div class="seg" id="kind">
        <button data-k="food" class="on"><svg class="i"><use href="#i-fork"/></svg>맛집</button>
        <button data-k="place"><svg class="i"><use href="#i-pin"/></svg>갈 곳</button>
      </div>
      <div class="search">
        <input id="q" placeholder="가게·장소 이름 (예: 수성못 카페, 동성로 파스타)" autocomplete="off">
        <button class="btn" id="qBtn"><svg class="i"><use href="#i-search"/></svg>검색</button>
      </div>
      <div class="hint">엔터로 검색 → 오른쪽 버튼으로 바로 추가. 지도를 옮긴 다음 검색하면 그 동네 위주로 찾아요.</div>
    </div>
    <div class="tabs" id="tabs">
      <button data-t="one" class="on">하나씩</button>
      <button data-t="bulk">여러 곳 한 번에</button>
      <button data-t="mine">우리 목록</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="mapwrap"><div id="map"></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ic = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
  async function api(path, opt = {}) {
    const r = await fetch("/api/" + path, { method: opt.method || "GET", headers: opt.body ? { "content-type": "application/json" } : {}, body: opt.body ? JSON.stringify(opt.body) : undefined, credentials: "same-origin" });
    let d = null; try { d = await r.json(); } catch {}
    if (!r.ok) { const e = new Error((d && d.error) || "오류 " + r.status); e.status = r.status; throw e; }
    return d;
  }
  function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }

  const S = { kind: "food", tab: "one", res: [], eats: [], added: new Set(), bulk: [], hl: -1 };
  const key = (n, lat, lon) => `${String(n).replace(/\s/g, "")}@${(+lat).toFixed(3)},${(+lon).toFixed(3)}`;
  const dist = (a, b) => { const R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r; const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
  const exists = (it) => S.eats.find((e) => (e.name.replace(/\s/g, "") === it.name.replace(/\s/g, "") && dist(e, it) < 150) || dist(e, it) < 8);

  function catOf(k, kind) {
    const c = String(k || "");
    if (kind === "place") {
      if (/카페|커피|cafe/i.test(c)) return "카페";
      if (/공원|수목원|정원|호수|못|숲/i.test(c)) return "공원";
      if (/둘레길|산책|하천|강변/i.test(c)) return "산책";
      if (/미술관|박물관|전시|갤러리/i.test(c)) return "전시";
      if (/영화|CGV|메가박스|롯데시네마/i.test(c)) return "영화";
      if (/공연|극장|콘서트/i.test(c)) return "공연";
      if (/백화점|쇼핑|아울렛|몰|시장/i.test(c)) return "쇼핑";
      if (/놀이|테마파크|방탈출|보드게임|볼링|노래방|오락|PC방|만화|공방|체험/i.test(c)) return "놀거리";
      if (/전망|야경|타워/i.test(c)) return "야경";
      if (/관광|명소|여행|해수욕|산$/i.test(c)) return "여행";
      return "기타";
    }
    if (/카페|커피|cafe/i.test(c)) return "카페";
    if (/디저트|베이커리|제과|빵|케이크|아이스크림/.test(c)) return "디저트";
    if (/술집|주점|호프|이자카야|bar|pub|와인|포차/i.test(c)) return "술집";
    if (/분식|떡볶이|김밥|간식|도시락/.test(c)) return "분식";
    if (/육류|고기|삼겹|갈비|곱창|막창|족발|보쌈|닭갈비|치킨/.test(c)) return "고기";
    if (/일식|초밥|돈가스|라멘|우동|일본/.test(c)) return "일식";
    if (/중식|중국|마라|훠궈|딤섬/.test(c)) return "중식";
    if (/양식|이탈리|파스타|피자|스테이크|버거|햄버거|패스트푸드|샌드위치|샐러드|브런치|프랑스|멕시칸/.test(c)) return "양식";
    if (/아시아|베트남|태국|쌀국수|인도/.test(c)) return "아시안";
    if (/한식|국밥|찌개|냉면|국수|해장|한정식|백반|칼국수|순대|감자탕/.test(c)) return "한식";
    return c ? "기타" : "한식";
  }

  // ---------- 지도 ----------
  let map, rMarks = [], eMarks = [];
  function initMap() {
    map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty", center: [128.6305, 35.8562], zoom: 12, attributionControl: { compact: true } });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.on("load", () => {
      // 지도 글자 한국어로
      for (const l of map.getStyle().layers) if (l.layout && l.layout["text-field"]) { try { map.setLayoutProperty(l.id, "text-field", ["coalesce", ["get", "name:ko"], ["get", "name"]]); } catch {} }
      drawEats(true);
    });
  }
  function drawEats(fit) {
    if (!map) return;
    eMarks.forEach((m) => m.remove()); eMarks = [];
    const list = S.eats.filter((e) => (e.kind || "food") === S.kind);
    for (const e of list) { const el = document.createElement("div"); el.className = "dot mine"; el.title = e.name; eMarks.push(new maplibregl.Marker({ element: el }).setLngLat([e.lon, e.lat]).addTo(map)); }
    if (fit && list.length) { const b = new maplibregl.LngLatBounds(); list.forEach((e) => b.extend([e.lon, e.lat])); map.fitBounds(b, { padding: 60, maxZoom: 14, duration: 0 }); }
  }
  function drawRes() {
    rMarks.forEach((m) => m.remove()); rMarks = [];
    const arr = S.tab === "bulk" ? S.bulk.filter((x) => x.it).map((x) => x.it) : S.res;
    arr.forEach((it, i) => {
      const el = document.createElement("div"); el.className = "mk" + (i === S.hl ? " hl" : ""); el.textContent = i + 1;
      el.onclick = () => hl(i, true);
      rMarks.push(new maplibregl.Marker({ element: el }).setLngLat([it.lon, it.lat]).addTo(map));
    });
    if (arr.length) { const b = new maplibregl.LngLatBounds(); arr.forEach((it) => b.extend([it.lon, it.lat])); map.fitBounds(b, { padding: 80, maxZoom: 15, duration: 500 }); }
  }
  function hl(i, scroll) {
    S.hl = i;
    rMarks.forEach((m, k) => m.getElement().classList.toggle("hl", k === i));
    document.querySelectorAll(".row[data-i]").forEach((r) => r.classList.toggle("hl", +r.dataset.i === i));
    const arr = S.tab === "bulk" ? S.bulk.filter((x) => x.it).map((x) => x.it) : S.res;
    if (arr[i]) map.easeTo({ center: [arr[i].lon, arr[i].lat], zoom: Math.max(map.getZoom(), 15), duration: 400 });
    if (scroll) { const r = document.querySelector(`.row[data-i="${i}"]`); if (r) r.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  }

  // ---------- 검색 ----------
  async function search(q, one) {
    const c = map ? map.getCenter() : null;
    const d = await api(`geo?q=${encodeURIComponent(q)}${c ? `&lat=${c.lat.toFixed(5)}&lon=${c.lng.toFixed(5)}` : ""}`);
    const r = (d.results || []).filter((x) => Number.isFinite(+x.lat) && Number.isFinite(+x.lon));
    return one ? r[0] || null : r.slice(0, 15);
  }
  async function add(it, status) {
    const body = { name: it.name.slice(0, 40), lat: +it.lat, lon: +it.lon, addr: it.addr || "", cat: catOf(it.cat || it.kind, S.kind), status, kind: S.kind, link: it.link || "" };
    await api("eats", { method: "POST", body });
    S.added.add(key(it.name, it.lat, it.lon));
    S.eats.unshift({ ...body, id: 0 });
    drawEats(false);
  }

  // ---------- 화면 ----------
  function rowHtml(it, i, extra = "") {
    const k = key(it.name, it.lat, it.lon), ex = exists(it);
    const done = S.added.has(k);
    return `<div class="row" data-i="${i}">
      ${extra || `<div class="n">${i + 1}</div>`}
      <div class="t" data-hl="${i}"><b>${esc(it.name)}${ex && !done ? `<span class="chip">이미 있음</span>` : ""}</b><span><em>${esc(catOf(it.cat || it.kind, S.kind))}</em> · ${esc(it.addr || it.cat || "")}</span></div>
      <div class="acts">${done ? `<span class="done">${ic("check")}추가함</span>` : `<button class="btn sm" data-add="${i}" data-s="want">${ic("heart")}가고 싶어</button><button class="btn sm gray" data-add="${i}" data-s="been">가봤어</button>`}</div>
    </div>`;
  }
  function render() {
    const L = $("#list");
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === S.tab));
    document.querySelectorAll("#kind button").forEach((b) => b.classList.toggle("on", b.dataset.k === S.kind));
    const nm = S.kind === "place" ? "갈 곳" : "맛집";
    if (S.tab === "one") {
      L.innerHTML = S.res.length ? S.res.map((it, i) => rowHtml(it, i)).join("") : `<div class="empty">위에서 ${nm} 이름을 검색해요.<br>여러 개를 한 번에 넣으려면 "여러 곳 한 번에"를 눌러요.</div>`;
    } else if (S.tab === "bulk") {
      const found = S.bulk.filter((x) => x.it);
      L.innerHTML = `<div class="bulk">
        <textarea id="bulkTx" placeholder="한 줄에 하나씩 적어요&#10;예)&#10;수성못 카페 오브&#10;동성로 미즈컨테이너&#10;앞산 전망대">${esc(S.bulkText || "")}</textarea>
        <div class="bar"><button class="btn" id="bulkGo">${ic("search")}한꺼번에 찾기</button>${found.length ? `<button class="btn gray" id="bulkAdd">고른 ${S.bulk.filter((x) => x.it && x.on && !S.added.has(key(x.it.name, x.it.lat, x.it.lon))).length}곳 추가</button>` : ""}<span id="bulkSt">${S.bulkSt || ""}</span></div>
      </div>
      ${S.bulk.map((x, j) => x.it
        ? rowHtml(x.it, found.indexOf(x), `<input type="checkbox" class="ck" data-ck="${j}" ${x.on ? "checked" : ""}>`)
        : `<div class="row"><div></div><div class="t"><b style="color:var(--sub)">${esc(x.q)}</b><span>못 찾았어요. 이름을 조금 바꿔서 다시 해보세요</span></div><div></div></div>`).join("")}`;
    } else {
      const list = S.eats.filter((e) => (e.kind || "food") === S.kind);
      L.innerHTML = list.length ? list.map((e) => `<div class="row"><div class="n" style="background:var(--rose)">${ic("check")}</div><div class="t"><b>${esc(e.name)}</b><span><em>${esc(e.cat || "")}</em> · ${esc(e.addr || "")} · ${e.status === "been" ? "가봤어요" : "가고 싶어요"}</span></div><div></div></div>`).join("") : `<div class="empty">아직 등록한 ${nm}이 없어요.</div>`;
    }
    drawRes();
  }

  $("#list").addEventListener("click", async (e) => {
    const a = e.target.closest("[data-add]"), h = e.target.closest("[data-hl]"), c = e.target.closest("[data-ck]");
    if (c) { const x = S.bulk[+c.dataset.ck]; x.on = c.checked; render(); return; }
    if (a) {
      const i = +a.dataset.add, arr = S.tab === "bulk" ? S.bulk.filter((x) => x.it).map((x) => x.it) : S.res;
      const it = arr[i]; if (!it) return;
      a.disabled = true;
      try { await add(it, a.dataset.s); toast(`${it.name} 추가했어요`); } catch (er) { toast(er.message); }
      render(); return;
    }
    if (h) hl(+h.dataset.hl);
  });
  $("#list").addEventListener("input", (e) => { if (e.target.id === "bulkTx") S.bulkText = e.target.value; });
  $("#list").addEventListener("click", async (e) => {
    if (e.target.closest("#bulkGo")) {
      const lines = (S.bulkText || "").split(/\n+/).map((x) => x.trim()).filter(Boolean).slice(0, 40);
      if (!lines.length) return toast("한 줄에 하나씩 적어주세요");
      S.bulk = []; S.bulkSt = `0 / ${lines.length} 찾는 중`; render();
      for (let i = 0; i < lines.length; i++) {
        let it = null; try { it = await search(lines[i], true); } catch {}
        S.bulk.push({ q: lines[i], it, on: !!it && !exists(it) });
        S.bulkSt = `${i + 1} / ${lines.length} 찾는 중`; render();
      }
      S.bulkSt = `${S.bulk.filter((x) => x.it).length}곳 찾았어요. 틀린 건 체크를 빼고 추가해요`; render();
    }
    if (e.target.closest("#bulkAdd")) {
      const todo = S.bulk.filter((x) => x.it && x.on && !S.added.has(key(x.it.name, x.it.lat, x.it.lon)));
      let n = 0;
      for (const x of todo) { try { await add(x.it, "want"); n++; S.bulkSt = `${n} / ${todo.length} 추가 중`; render(); } catch (er) { toast(er.message); } }
      toast(`${n}곳 추가했어요`); S.bulkSt = `${n}곳 추가했어요`; render();
    }
  });
  async function doSearch() {
    const q = $("#q").value.trim(); if (!q) return;
    S.tab = "one"; S.hl = -1;
    $("#list").innerHTML = `<div class="empty">찾는 중...</div>`;
    try { S.res = await search(q); if (!S.res.length) toast("못 찾았어요. 동네 이름을 붙여보세요 (예: 수성구 파스타)"); } catch (er) { toast(er.message); S.res = []; }
    render();
  }
  $("#qBtn").onclick = doSearch;
  $("#q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) doSearch(); });
  document.addEventListener("keydown", (e) => {
    if (S.tab !== "one" || !S.res.length || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowDown") { e.preventDefault(); hl(Math.min(S.res.length - 1, S.hl + 1), true); }
    if (e.key === "ArrowUp") { e.preventDefault(); hl(Math.max(0, S.hl - 1), true); }
  });
  $("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.tab = b.dataset.t; S.hl = -1; render(); };
  $("#kind").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.kind = b.dataset.k; $("#q").placeholder = S.kind === "place" ? "갈 곳 이름 (예: 앞산 전망대, 수성못)" : "가게 이름 (예: 수성못 카페, 동성로 파스타)"; drawEats(false); render(); };

  // ---------- 시작 ----------
  async function start() {
    try { await api("me"); } catch (e) {
      if (e.status !== 401) { document.body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
      const st = await api("state").catch(() => ({}));
      if (!st.setup) { location.href = "/"; return; }
      $("#gate").hidden = false;
      let who = "";
      $("#who").innerHTML = ["a", "b"].map((w) => `<button data-w="${w}">${esc(st.names[w])}</button>`).join("");
      $("#who").onclick = (ev) => { const b = ev.target.closest("button"); if (!b) return; who = b.dataset.w; document.querySelectorAll("#who button").forEach((x) => x.classList.toggle("on", x === b)); $("#pw").focus(); };
      const go = async () => { if (!who) return ($("#err").textContent = "누구인지 골라주세요"); try { await api("login", { method: "POST", body: { who, password: $("#pw").value } }); $("#gate").hidden = true; start(); } catch (er) { $("#err").textContent = er.message; } };
      $("#go").onclick = go; $("#pw").onkeydown = (ev) => { if (ev.key === "Enter") go(); };
      return;
    }
    $("#app").hidden = false;
    try { S.eats = (await api("eats")).eats || []; } catch {}
    initMap(); render(); $("#q").focus();
  }
  start();
})();
</script>
</body>
</html>
